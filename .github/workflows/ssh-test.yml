
      - name: Test SSH connection
        env:
          EC2_HOST: "15.135.238.202"
          EC2_USER: "ubuntu"
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST secret is missing or empty"
            exit 1
          fi

          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER secret is missing or empty"
            exit 1
          fi

          echo "Testing SSH connection to EC2..."
          ssh -i ~/.ssh/ec2_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            "${EC2_USER}@${EC2_HOST}" \
            "whoami && hostname"
