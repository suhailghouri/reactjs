
      - name: Test SSH and create file on EC2
        env:
          EC2_HOST: "15.135.238.202"
          EC2_USER: "deploy"
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            'touch /home/deploy/github-actions-ssh-test.txt && echo "SSH connection successful" && whoami && ls -l /home/deploy/github-actions-ssh-test.txt'
