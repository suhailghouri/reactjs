      - name: Diagnose EC2 SSH access
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty"
            exit 1
          fi

          echo "Checking SSH port 22 for configured host..."
          ssh-keyscan -T 10 -t ed25519 "$EC2_HOST" \
            >> ~/.ssh/known_hosts 2> /tmp/keyscan-error.log || true

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "No SSH host key received."
            cat /tmp/keyscan-error.log
            exit 1
          fi

          echo "SSH host key received."
