name: React CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ssh-check:
    uses: ./.github/workflows/ssh-test.yml

  build-and-deploy:
    needs: ssh-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build React App
        run: npm run build
